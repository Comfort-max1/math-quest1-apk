<style>
  :root{--blue:#2f6fed;--blue-dark:#1f56c4;--green:#1fa97a;--red:#e5534b;--amber:#f5a623;--purple:#7c5cff;--bg:#f2f6fc;--card:#fff;--ink:#1c2b3a;--sub:#5b6b7b;--line:#dbe6f2;--radius:18px}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:linear-gradient(160deg,#eef3ff 0%,#f6f2ff 55%,#f2f6fc 100%);color:var(--ink);min-height:100vh;display:flex;justify-content:center}
  .wrap{width:100%;max-width:720px;padding:20px 16px 48px}
  .view{display:none}.view.active{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .hero{background:linear-gradient(135deg,#7c5cff,#2f6fed);border-radius:24px;padding:36px 24px;color:#fff;text-align:center;box-shadow:0 14px 30px rgba(124,92,255,.28);position:relative;overflow:hidden}
  .hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.12)}
  .hero::before{width:160px;height:160px;top:-60px;right:-40px}.hero::after{width:110px;height:110px;bottom:-40px;left:-30px}
  .mascot{width:84px;height:84px;margin:0 auto 10px;animation:bob 2.4s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .hero h1{font-size:28px;margin-bottom:10px}.hero p{font-size:15px;opacity:.94;line-height:1.7;max-width:480px;margin:0 auto}
  .rule-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0}
  .rule-row span{background:rgba(255,255,255,.16);border-radius:12px;padding:9px 13px;font-size:13px}
  .start-btn{margin-top:8px;display:inline-flex;align-items:center;gap:8px;background:var(--amber);color:#fff;border:none;font-size:18px;font-weight:bold;padding:15px 36px;border-radius:999px;cursor:pointer;box-shadow:0 8px 18px rgba(245,166,35,.4)}
  .map-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  .map-head h2{font-size:20px}
  .sound-btn{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer;color:var(--sub);font-size:14px}
  .stage{margin-bottom:18px}
  .stage-title{font-size:14px;font-weight:bold;color:var(--sub);margin:0 4px 10px}
  .nodes{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
  .node{aspect-ratio:1;max-width:44px;margin:0 auto;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:bold;font-size:12px;background:#e7eef7;color:#9db2c6;border:2px dashed #c9d9ea}
  .node .ico{width:14px;height:14px}
  .node.current{background:var(--blue);color:#fff;border-color:var(--blue)}
  .node.done{background:var(--amber);color:#fff;border-color:var(--amber)}
  .node.miss{background:var(--red);color:#fff;border-color:var(--red)}
  .node.locked{opacity:.55}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;flex-wrap:wrap}
  .hud{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 15px;font-weight:bold;font-size:14px;display:inline-flex;gap:6px;align-items:center;box-shadow:0 3px 10px rgba(28,43,58,.07)}
  .star{color:var(--amber)}.combo{color:var(--purple)}
  .progress-track{height:12px;background:#e2ecf7;border-radius:999px;overflow:hidden;margin-bottom:18px;box-shadow:inset 0 1px 3px rgba(28,43,58,.12)}
  .progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--purple),var(--blue));border-radius:999px;transition:width .3s}
  .card{background:var(--card);border-radius:22px;padding:24px 22px;box-shadow:0 12px 30px rgba(47,111,237,.12);border:1px solid rgba(219,230,242,.7)}
  .q-tag{display:inline-block;background:linear-gradient(135deg,#2f6fed,#5b9bff);color:#fff;font-size:12px;font-weight:bold;padding:5px 12px;border-radius:999px;letter-spacing:.5px}
  .q-level{display:inline-block;font-size:11px;padding:3px 10px;border-radius:999px;color:#fff;margin-left:6px;font-weight:bold}
  .q-level.basic{background:var(--green)}.q-level.hard{background:var(--amber)}
  .q-stem{font-size:20px;font-weight:bold;line-height:1.6;margin:14px 0 20px;color:var(--ink)}
  .options{display:grid;gap:13px}
  .opt{display:flex;align-items:center;gap:13px;border:2px solid var(--line);border-radius:16px;padding:15px 15px;cursor:pointer;background:#fff;transition:border-color .15s,background .15s,transform .12s,box-shadow .15s;min-height:50px;position:relative}
  .opt:hover:not(.locked){border-color:var(--blue);background:#f6faff;transform:translateX(4px);box-shadow:0 6px 16px rgba(47,111,237,.14)}
  .opt .key{flex:0 0 32px;height:32px;border-radius:11px;background:#eef3fa;color:var(--sub);display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:15px;transition:inherit}
  .opt .txt{font-size:16px;line-height:1.5;min-width:0;padding-right:26px}
  .opt.correct{border-color:var(--green);background:#eaf8f2;animation:pop .3s}
  .opt.correct .key{background:var(--green);color:#fff}
  .opt.correct::after{content:"✓";position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:20px;font-weight:bold;color:var(--green)}
  .opt.wrong{border-color:var(--red);background:#fdeeee;animation:shake .3s}
  .opt.wrong .key{background:var(--red);color:#fff}
  .opt.wrong::after{content:"✕";position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:18px;font-weight:bold;color:var(--red)}
  .opt.locked{cursor:default}.opt.dim{opacity:.5}
  @keyframes pop{0%{transform:scale(.96)}50%{transform:scale(1.03)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .explain{margin-top:16px;border-left:4px solid var(--amber);background:#fff8ec;border-radius:0 16px 16px 0;padding:15px 17px;font-size:15px;line-height:1.7;display:none;box-shadow:0 4px 12px rgba(245,166,35,.12)}
  .explain.show{display:block;animation:fade .2s ease}.explain b{color:var(--amber)}
  .diagram{margin-top:12px;background:#fff;border:1px dashed var(--line);border-radius:12px;padding:12px}
  .diagram svg{width:100%;height:auto;display:block}.diagram .cap{font-size:12px;color:var(--sub);margin-top:6px;text-align:center}
  .anim{transform-origin:center;animation:grow .6s ease both}@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .next-row{margin-top:18px;display:flex;justify-content:flex-end}
  .next-btn{background:linear-gradient(135deg,var(--blue),#5b9bff);color:#fff;border:none;font-size:16px;font-weight:bold;padding:13px 28px;border-radius:14px;cursor:pointer;box-shadow:0 8px 18px rgba(47,111,237,.3);transition:transform .12s,box-shadow .15s}
  .next-btn:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(47,111,237,.4)}
  .particle{position:fixed;width:10px;height:10px;pointer-events:none;z-index:50;border-radius:50%}
  .result{background:var(--card);border-radius:var(--radius);padding:30px 22px;text-align:center;box-shadow:0 6px 18px rgba(28,43,58,.08)}
  .trophy{width:110px;height:110px;margin:0 auto 14px}
  .result h2{font-size:24px;margin-bottom:8px}.grade{font-size:18px;font-weight:bold;color:var(--blue-dark);margin-bottom:6px}.meta{color:var(--sub);font-size:15px;margin-bottom:8px}
  .stat-row{display:flex;gap:10px;justify-content:center;margin:16px 0;flex-wrap:wrap}
  .stat{background:#f2f6fc;border-radius:14px;padding:12px 18px;min-width:96px}
  .stat .num{font-size:22px;font-weight:bold;color:var(--blue-dark)}.stat .lab{font-size:12px;color:var(--sub)}
  .review{text-align:left;margin:18px 0;display:grid;gap:10px}
  .review-item{border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.6}
  .review-item .ok{color:var(--green);font-weight:bold}.review-item .no{color:var(--red);font-weight:bold}.review-item .ans{color:var(--sub)}
  .again-btn{background:var(--amber);color:#fff;border:none;font-size:16px;font-weight:bold;padding:13px 30px;border-radius:12px;cursor:pointer}
  @media (min-width:600px){.q-stem{font-size:21px}}
</style>
</head>
<body>
<div class="wrap">

      <div class="explain" id="explain"></div>
      <div class="next-row"><button class="next-btn" id="btn-next" style="display:none">下一题</button></div>

  <section class="view" id="view-fail">
    <div class="result">
      <svg class="trophy" viewBox="0 0 110 110">
        <circle cx="55" cy="55" r="50" fill="#fdeeee"/>

      <h2>挑战失败</h2>
      <div class="grade" style="color:var(--red)" id="fail-title">本关未达标</div>
      <div class="meta" id="fail-meta"></div>
      <div class="stat-row">
        <div class="stat"><div class="num" id="fail-score">0</div><div class="lab">本关得分</div></div>
        <div class="stat"><div class="num" id="fail-correct">0</div><div class="lab">答对题数</div></div>
        <div class="stat"><div class="num">70</div><div class="lab">过关门槛</div></div>
      </div>
      <div class="review-item" style="margin-bottom:18px;color:var(--sub)">本关需要达到 70 分才能解锁下一关，复习错题解析后再试一次吧。</div>
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">

        <button class="again-btn" id="btn-home" style="background:#7c8aa0">返回主页</button>
      </div>

  <section class="view" id="view-result">
    <div class="result">
      <svg class="trophy" viewBox="0 0 110 110">
        <circle cx="55" cy="55" r="50" fill="#fff4df"/>
        <path d="M35 30h40v18a20 20 0 0 1-40 0z" fill="#f5a623"/>
        <path d="M35 34H22a13 13 0 0 0 13 14M75 34h13a13 13 0 0 1-13 14" stroke="#f5a623" stroke-width="5" fill="none"/>
        <rect x="50" y="66" width="10" height="10" fill="#f5a623"/><rect x="40" y="76" width="30" height="8" rx="3" fill="#f5a623"/>

      <h2>闯关完成</h2>
      <div class="grade" id="grade"></div><div class="meta" id="meta"></div>
      <div class="stat-row">
        <div class="stat"><div class="num" id="stat-score">0</div><div class="lab">总分</div></div>
        <div class="stat"><div class="num" id="stat-star">0</div><div class="lab">星星</div></div>
        <div class="stat"><div class="num" id="stat-combo">0</div><div class="lab">最高连击</div></div>
      </div>
      <div class="review" id="review"></div>
      <button class="again-btn" id="btn-again">再玩一次</button>
    </div>
  </section>

</div>

let actx=null;
function tone(freq,dur,type="sine",when=0,vol=0.18){if(!state.sound)return;try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=freq;g.gain.value=vol;g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+dur);o.connect(g);g.connect(actx.destination);o.start(actx.currentTime+when);o.stop(actx.currentTime+when+dur)}catch(e){}}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function buildPaper(){
  const basic=shuffle(QUESTIONS.filter(q=>q.level==="basic"));
  const hard=shuffle(QUESTIONS.filter(q=>q.level==="hard"));
  paper=[];
  for(let s=0;s<STAGE_COUNT;s++){
    for(let b=0;b<BASIC_PER;b++)paper.push(basic.pop());
    for(let h=0;h<HARD_PER;h++)paper.push(hard.pop());
  }
}
function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}

function fracBar(x,y,w,num,den,color){const seg=w/den;let c="";for(let i=0;i<den;i++)c+=`<rect x="${x+i*seg}" y="${y}" width="${seg-2}" height="18" rx="3" fill="${i<num?color:"#e7eef7"}"/>`;return c}
function renderDiagram(d){
  if(!d)return "";
  switch(d.type){
    case "strip":return `<div class="diagram"><svg viewBox="0 0 220 110"><text x="110" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1c2b3a">${esc(d.a)} ${esc(d.b)} = ${esc(d.c)}</text><rect x="30" y="50" width="160" height="26" rx="6" fill="#e7eef7"/><rect class="anim" x="30" y="50" width="${160*0.62}" height="26" rx="6" fill="#2f6fed"/><text x="30" y="100" text-anchor="middle" font-size="11" fill="#5b6b7b">0</text><text x="190" y="100" text-anchor="middle" font-size="11" fill="#5b6b7b">结果</text></svg><div class="cap">涂色部分表示运算结果</div></div>`;
    case "balance":return `<div class="diagram"><svg viewBox="0 0 220 130"><line x1="110" y1="30" x2="110" y2="95" stroke="#5b6b7b" stroke-width="3"/><line x1="30" y1="30" x2="190" y2="30" stroke="#5b6b7b" stroke-width="3"/><path d="M30 30 l-12 26 h24 z" fill="#e7eef7"/><path d="M190 30 l-12 26 h24 z" fill="#e7eef7"/><text x="30" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f56c4">${esc(d.left)}</text><text x="190" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f56c4">${esc(d.right)}</text><text x="110" y="110" text-anchor="middle" font-size="12" fill="#5b6b7b">${esc(d.remove)}</text><text x="110" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#f5a623">${esc(d.result)}</text></svg><div class="cap">天平两边同加同减同除，仍然平衡</div></div>`;
    case "para":return `<div class="diagram"><svg viewBox="0 0 220 120"><polygon class="anim" points="50,90 150,90 180,30 80,30" fill="#2f6fed" fill-opacity=".85"/><line x1="80" y1="30" x2="80" y2="90" stroke="#fff" stroke-width="2" stroke-dasharray="5 4"/><polygon points="50,90 80,90 80,30" fill="#1fa97a" fill-opacity=".9"/><text x="115" y="108" text-anchor="middle" font-size="12" fill="#5b6b7b">底 ${d.base}</text><text x="186" y="62" font-size="12" fill="#5b6b7b">高 ${d.h}</text></svg><div class="cap">割补拼成长方形：底 × 高</div></div>`;
    case "tri":return `<div class="diagram"><svg viewBox="0 0 220 120"><polygon points="30,95 120,95 75,30" fill="#2f6fed" fill-opacity=".85"/><polygon points="100,95 190,95 145,30" fill="#1fa97a" fill-opacity=".55"/><line x1="100" y1="95" x2="100" y2="30" stroke="#fff" stroke-width="1.5" stroke-dasharray="4 3"/><text x="75" y="112" text-anchor="middle" font-size="12" fill="#5b6b7b">底 ${d.base}</text></svg><div class="cap">两个相同三角形拼成平行四边形</div></div>`;
    case "trap":return `<div class="diagram"><svg viewBox="0 0 220 120"><polygon points="30,90 110,90 95,40 45,40" fill="#2f6fed" fill-opacity=".85"/><polygon points="100,90 190,90 175,40 120,40" fill="#1fa97a" fill-opacity=".55"/><text x="70" y="106" text-anchor="middle" font-size="11" fill="#5b6b7b">下底 ${d.b}</text></svg><div class="cap">两个相同梯形拼成平行四边形</div></div>`;
    case "factor":return `<div class="diagram"><svg viewBox="0 0 220 100"><text x="110" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f56c4">${esc(d.n)} 的因数</text>${d.list.map((f,i)=>`<rect x="${30+i*42}" y="50" width="34" height="28" rx="8" fill="#eaf2ff"/><text x="${47+i*42}" y="69" text-anchor="middle" font-size="13" fill="#1f56c4">${f}</text>`).join("")}</svg><div class="cap">因数成对出现</div></div>`;
    case "fraction":return `<div class="diagram"><svg viewBox="0 0 220 120"><text x="20" y="28" font-size="12" fill="#1c2b3a">${d.num1}/${d.den1}</text>${fracBar(30,40,160,d.num1,d.den1,"#2f6fed")}<text x="20" y="88" font-size="12" fill="#1c2b3a">${d.num2}/${d.den2}</text>${fracBar(30,100,160,d.num2,d.den2,"#1fa97a")}</svg><div class="cap">涂色越多分数越大</div></div>`;
    case "cubes":{let cells="";for(let r=0;r<Math.min(d.h,3);r++)for(let c=0;c<Math.min(d.l,5);c++)cells+=`<rect x="${30+c*22}" y="${70-r*20}" width="18" height="16" rx="3" fill="#2f6fed" fill-opacity="${0.55+r*0.18}"/>`;return `<div class="diagram"><svg viewBox="0 0 220 110">${cells}<text x="110" y="104" text-anchor="middle" font-size="12" fill="#5b6b7b">${d.l} × ${d.w} × ${d.h}</text></svg><div class="cap">每层块数 × 层数 = 体积</div></div>`}
    case "grid":{let g="";for(let x=1;x<=5;x++)for(let y=1;y<=5;y++)g+=`<rect x="${30+x*22}" y="${20+y*16}" width="18" height="14" fill="none" stroke="#dbe6f2"/>`;const px=30+d.col*22+9,py=20+d.row*16+7;return `<div class="diagram"><svg viewBox="0 0 220 130">${g}<circle cx="${px}" cy="${py}" r="7" fill="#f5a623"/><text x="140" y="112" font-size="11" fill="#5b6b7b">列 ${d.col} · 行 ${d.row}</text></svg><div class="cap">先数列再数行</div></div>`}
    default:return "";
  }
}

function renderMap(){
  const map=$("map");map.innerHTML="";
  STAGES.forEach(st=>{
    const stage=document.createElement("div");stage.className="stage";
    const title=document.createElement("div");title.className="stage-title";title.textContent=st.name;
    const nodes=document.createElement("div");nodes.className="nodes";
    for(let i=st.range[0];i<=st.range[1];i++){
      const n=document.createElement("div");const stt=state.status[i]||"locked";n.className="node "+stt;
      let ico="";
      if(stt==="done")ico='<svg class="ico" viewBox="0 0 24 24" fill="white"><path d="M12 2l2.4 4.9 5.4.8-3.9 3.8.9 5.4-4.8-2.5-4.8 2.5.9-5.4L4.2 7.7l5.4-.8z"/></svg>';
      else if(stt==="miss")ico='<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><path d="M6 6l12 12M18 6L6 18"/></svg>';
      else ico='<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#9db2c6" stroke-width="2"><circle cx="12" cy="12" r="5"/></svg>';
      n.innerHTML=ico+"<span>"+(i+1)+"</span>";nodes.appendChild(n);
    }
    stage.appendChild(title);stage.appendChild(nodes);map.appendChild(stage);
  });
}

function stageOf(i){return Math.floor(i/PER_STAGE)}
function resetStage(){state.stageScore=0;state.stageCorrect=0;state.combo=0}
function renderQuestion(){
  const q=paper[state.index];state.picked=-1;state.locked=false;
  const stage=stageOf(state.index),pos=state.index%PER_STAGE+1;
  $("progress-label").textContent="第 "+(stage+1)+" 关 · 第 "+pos+"/10 题";
  $("progress-fill").style.width=(pos/PER_STAGE*100)+"%";
  $("q-tag").textContent=q.tag;
  const lv=$("q-level");lv.className="q-level "+q.level;lv.textContent=q.level==="basic"?"基础":"提升";
  $("q-stem").textContent=q.stem;$("score").textContent=state.stageScore;$("stars").textContent=state.stars;
  const ex=$("explain");ex.classList.remove("show");ex.innerHTML="";
  $("btn-next").style.display="none";updateCombo();
  const box=$("options");box.innerHTML="";const keys=["A","B","C","D"];
  q.options.forEach((text,i)=>{const div=document.createElement("div");div.className="opt";div.innerHTML='<div class="key">'+keys[i]+'</div><div class="txt"></div>';div.querySelector(".txt").textContent=text;div.addEventListener("click",()=>choose(i,div));box.appendChild(div)});
}
function updateCombo(){const p=$("combo-pill");if(state.combo>=2){p.style.display="inline-flex";$("combo").textContent=state.combo}else p.style.display="none"}
function burst(x,y,color){for(let k=0;k<10;k++){const p=document.createElement("div");p.className="particle";p.style.background=color;p.style.left=x+"px";p.style.top=y+"px";document.body.appendChild(p);const ang=Math.random()*Math.PI*2,dist=50+Math.random()*50;p.animate([{transform:"translate(0,0) scale(1)",opacity:1},{transform:"translate("+Math.cos(ang)*dist+"px,"+Math.sin(ang)*dist+"px) scale(.3)",opacity:0}],{duration:600+Math.random()*300,easing:"ease-out"}).onfinish=()=>p.remove()}}

function choose(i,el){
  if(state.locked)return;state.locked=true;
  const q=paper[state.index];const opts=[...document.querySelectorAll(".opt")];
  opts.forEach(o=>o.classList.add("locked","dim"));el.classList.remove("dim");
  const rect=el.getBoundingClientRect();
  if(i===q.answer){el.classList.add("correct");state.combo++;state.maxCombo=Math.max(state.maxCombo,state.combo);state.score+=10+Math.min(state.combo-1,5)*2;state.stageScore+=10;state.stageCorrect++;state.stars+=state.combo>=3?2:1;state.status[state.index]="done";sndRight();burst(rect.left+rect.width/2,rect.top+rect.height/2,"#f5a623")}
  else{el.classList.add("wrong");opts[q.answer].classList.add("correct");state.combo=0;state.status[state.index]="miss";state.wrong.push({q,picked:i,gi:state.index});sndWrong();burst(rect.left+rect.width/2,rect.top+rect.height/2,"#e5534b")}
  $("score").textContent=state.stageScore;$("stars").textContent=state.stars;updateCombo();
  const ex=$("explain");
  ex.innerHTML="<b>解析：</b>"+q.explain;
  ex.insertAdjacentHTML("beforeend",renderDiagram(q.diagram));
  ex.classList.add("show");
  const stageEnd=(state.index%PER_STAGE===PER_STAGE-1);const nb=$("btn-next");nb.style.display="inline-flex";nb.textContent=stageEnd?"关卡结算":"下一题";
}
function gradeOf(s){if(s>=900)return["数学小达人","反应又快又准，太厉害啦！"];if(s>=700)return["实力小将","基础扎实，再练几道更稳。"];if(s>=600)return["稳步前进","基本掌握，错题再看一遍。"];return["继续加油","别灰心，跟着解析补一补再来挑战！"]}
function showResult(){
  const pct=state.score/(paper.length*10);const [g,msg]=gradeOf(state.score);
  $("grade").textContent=g;$("meta").textContent="答对 "+(paper.length-state.wrong.length)+" 题 · "+msg;
  $("stat-score").textContent=state.score;$("stat-star").textContent=state.stars;$("stat-combo").textContent=state.maxCombo;
  const review=$("review");review.innerHTML="";
  if(state.wrong.length===0)review.innerHTML='<div class="review-item"><span class="ok">全部答对</span>，没有错题需要回顾。</div>';
  else state.wrong.forEach(item=>{const d=document.createElement("div");d.className="review-item";d.innerHTML='<div><span class="no">答错</span>：'+esc(item.q.stem)+'</div><div class="ans">你的选择：'+esc(item.q.options[item.picked])+' ｜ 正确答案：'+esc(item.q.options[item.q.answer])+'</div>';review.appendChild(d)});
  show("result");
}
function showFail(){
  const stage=stageOf(state.index);
  $("fail-score").textContent=state.stageScore;
  $("fail-correct").textContent=state.stageCorrect;
  $("fail-meta").textContent="第 "+(stage+1)+" 关 得分 "+state.stageScore+"，答对 "+state.stageCorrect+"/10，未达 70 分";
  show("fail");
}
function retryStage(){
  const stage=stageOf(state.index),start=stage*PER_STAGE;
  state.wrong=state.wrong.filter(w=>w.gi<start||w.gi>=start+PER_STAGE);
  for(let k=0;k<PER_STAGE;k++)state.status[start+k]="locked";
  state.index=start;resetStage();state.status[start]="current";
  sndStart();renderMap();renderQuestion();show("quiz");
}
function startGame(){buildPaper();state.index=0;state.score=0;state.stars=0;state.combo=0;state.maxCombo=0;state.stageScore=0;state.stageCorrect=0;state.currentStage=0;state.status=Array(paper.length).fill("locked");state.wrong=[];state.status[0]="current";sndStart();renderMap();renderQuestion();show("quiz")}
$("btn-start").addEventListener("click",startGame);
$("btn-next").addEventListener("click",()=>{
  const stage=stageOf(state.index);
  const stageEnd=(state.index%PER_STAGE===PER_STAGE-1);
  if(!stageEnd){state.index++;state.status[state.index]="current";renderMap();renderQuestion();return}
  if(state.stageScore>=70){
    if(stage===STAGE_COUNT-1){showResult();return}
    state.currentStage=stage+1;resetStage();state.index=state.currentStage*PER_STAGE;state.status[state.index]="current";
    renderMap();renderQuestion();
  }else{
    for(let k=0;k<PER_STAGE;k++){const gi=stage*PER_STAGE+k;if(state.status[gi]!=="done")state.status[gi]="miss";}
    showFail();
  }
});
$("btn-again").addEventListener("click",startGame);
$("btn-retry").addEventListener("click",retryStage);
$("btn-home").addEventListener("click",()=>show("start"));
$("btn-sound").addEventListener("click",()=>{state.sound=!state.sound;$("btn-sound").textContent=state.sound?"音效：开":"音效：关"});
</script>
</body>
